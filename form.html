<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback Form</title>
</head>
<body>
    <h1>Feedback Form</h1>

    <form action="thanks.html" method="get">
        <!-- Full Name -->
        <label for="fullname">Full Name:</label><br>
        <input type="text" id="fullname" name="fullname" required><br><br>

        <!-- Email -->
        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email" required><br><br>

        <!-- Gender -->
        <label>Gender:</label><br>
        <input type="radio" id="male" name="gender" value="Male">
        <label for="male">Male</label>
        <input type="radio" id="female" name="gender" value="Female">
        <label for="female">Female</label><br><br>

        <!-- Department -->
        <label for="department">Department:</label><br>
        <select id="department" name="department">
            <option value="AI">AI</option>
            <option value="CS">CS</option>
            <option value="SE">SE</option>
            <option value="EE">EE</option>
        </select><br><br>

        <!-- Interests -->
        <label>Interests:</label><br>
        <input type="checkbox" id="interest_web" name="interests" value="Web">
        <label for="interest_web">Web</label>
        <input type="checkbox" id="interest_ai" name="interests" value="AI">
        <label for="interest_ai">AI</label>
        <input type="checkbox" id="interest_games" name="interests" value="Games">
        <label for="interest_games">Games</label><br><br>

        <!-- Comments -->
        <label for="comments">Comments:</label><br>
        <textarea id="comments" name="comments" rows="4" cols="30"></textarea><br><br>

        <!-- Send Button -->
        <button type="submit">Send</button>
    </form>

    <br>
    <a href="about.html">Back to Home</a>
</body>
</html>
