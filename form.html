<!DOCTYPE html>
<html>
<head>
    <title>Registration Form</title>
</head>
<body>

    <a href="index.html">Home</a>
    <h2>Student Registration Form</h2>

    <form action="thanks.html" method="get">
        <p>
            <label>Full Name:</label><br>
            <input type="text" name="fullname" placeholder="Enter full name" required>
        </p>

        <p>
            <label>Registration No:</label><br>
            <input type="text" name="regno" required>
        </p>

        <p>
            <label>Email:</label><br>
            <input type="email" name="email" required>
        </p>

        <p>
            <label>Phone:</label><br>
            <input type="tel" name="phone" placeholder="03XXXXXXXXX">
        </p>

        <p>
            <label>Age:</label><br>
            <input type="number" name="age" min="16" max="40">
        </p>

        <p>
            <label>Date of Birth:</label><br>
            <input type="date" name="dob">
        </p>

        <p>
            <label>Gender:</label><br>
            <input type="radio" name="gender" value="Male"> Male
            <input type="radio" name="gender" value="Female"> Female
        </p>

        <p>
            <label>Department:</label><br>
            <select name="department">
                <option value="AI">AI</option>
                <option value="CS">CS</option>
                <option value="SE">SE</option>
                <option value="EE">EE</option>
            </select>
        </p>

        <p>
            <label>Interests:</label><br>
            <input type="checkbox" name="interest" value="Web"> Web
            <input type="checkbox" name="interest" value="AI"> AI
            <input type="checkbox" name="interest" value="Games"> Games
        </p>

        <p>
            <label>Address:</label><br>
            <textarea name="address" rows="4"></textarea>
        </p>

        <p>
            <input type="submit" value="Register">
            <input type="reset" value="Clear">
        </p>
    </form>

</body>
</html>
